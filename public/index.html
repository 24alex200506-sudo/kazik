.delta.up{color:var(--gr)}.delta.dn{color:var(--rd)}

.sw.on{border-color:#a855f788}.sw.on i{background:linear-gradient(90deg,#a855f7,#ec4899);box-shadow:0 0 12px #a855f7aa}.sw.on i:after{left:19px}

.b:hover:not(:disabled):before{left:150%}
.b:hover:not(:disabled){transform:translateY(-2px) scale(1.02)}

    bt.innerHTML=lvl>=1?`ЗАБРАТЬ<small>${fmt(rb(bet*mulAt(lvl)))} ₽ · x${mf(mulAt(lvl))}</small>`:'ЗАБРАТЬ';

  ['am6','h6','d6'].forEach(i=>$(i).disabled=play);

  $('nh').textContent=msg||(play&&n>1?`Выберите ячейки: ${sel.size} из ${n}`:'Выберите ячейку');

function start(){
  if(st==='play')return true;
  const a=am();
  if(a>S.bal){msg='Недостаточно средств';ui();return false}
  S.bal=rb(S.bal-a);bet=a;lvl=0;res=0;msg='';sel=new Set();
  trap=Array.from({length:LV},()=>Math.floor(Math.random()*CE));
  cells.forEach(cr=>cr.forEach(b=>{b.innerHTML=NUT;b.className='nc'}));
  st='play';save();setBal();ui();return true;
}
function end(win){
  st='over';res=win;
  const m=win>0?mulAt(lvl):0;
  if(win>0&&lvl<LV)cells[lvl].forEach(b=>{if(b.classList.contains('sel'))b.className='nc'});
  for(let r=0;r<LV;r++){const el=cells[r][trap[r]];if(el.classList.contains('bad'))continue;el.innerHTML=TRAP;el.className='nc tr'}
  if(win>0){S.bal=rb(S.bal+win);msg=`Выигрыш +${fmt(rb(win-bet))} ₽ · x${mf(m)}`}else msg='Ловушка! Ставка потеряна';
  S.nuts.unshift({b:bet,m,w:win});S.nuts=S.nuts.slice(0,40);
  sel=new Set();save();setBal();ui();renderFeed();
}
function resolve(){
  const r=lvl;
  if(sel.has(trap[r])){const el=cells[r][trap[r]];el.innerHTML=TRAP;el.className='nc bad';end(0);return}
  sel.forEach(c=>{cells[r][c].className='nc ok'});sel=new Set();lvl++;
  if(lvl===LV)end(rb(bet*mulAt(LV)));else ui();
}
function choose(c){
  if(st!=='play'&&!start())return;
  if(sel.has(c)){sel.delete(c);cells[lvl][c].className='nc';ui();return}
  sel.add(c);cells[lvl][c].className='nc sel';
  if(sel.size>=n)resolve();else ui();
}
function autoPick(){
  if(st!=='play'&&!start())return;
  const pool=[];for(let c=0;c<CE;c++)if(!sel.has(c))pool.push(c);
  while(sel.size<n&&pool.length){const c=pool.splice(Math.floor(Math.random()*pool.length),1)[0];sel.add(c);cells[lvl][c].className='nc sel'}
  resolve();
}
